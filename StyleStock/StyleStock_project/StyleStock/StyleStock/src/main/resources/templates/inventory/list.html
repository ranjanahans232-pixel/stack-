<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inventory | StyleStock</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main><h1>Inventory</h1><p class="muted">Current stock quantities by product and distribution centre.</p>
<section class="panel table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Centre</th><th>Quantity</th><th>Reorder level</th><th>Status</th></tr></thead>
<tbody><tr th:each="item : ${inventories}">
<td th:text="${item.product.productName}"></td><td th:text="${item.product.sku}"></td><td th:text="${item.centre.centreName}"></td>
<td th:text="${item.quantity}"></td><td th:text="${item.reorderLevel}"></td>
<td><span th:if="${item.quantity <= item.reorderLevel}" class="badge">Low stock</span><span th:unless="${item.quantity <= item.reorderLevel}">In stock</span></td>
</tr><tr th:if="${#lists.isEmpty(inventories)}"><td colspan="6">No inventory records available.</td></tr></tbody></table></section>
</main><footer>StyleStock · Inventory overview</footer></body></html>
