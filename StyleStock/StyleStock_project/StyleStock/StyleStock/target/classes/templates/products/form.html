<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product form | StyleStock</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
  <h1 th:text="${product.productId == null ? 'Add product' : 'Edit product'}">Add product</h1>
  <p class="muted">Complete all required fields and save the product.</p>
  <section class="panel">
    <form th:object="${product}" th:action="${product.productId == null ? '/products' : '/products/' + product.productId}" method="post">
      <div class="form-grid">
        <div><label for="productName">Product name *</label><input id="productName" th:field="*{productName}" required><p class="muted" th:errors="*{productName}"></p></div>
        <div><label for="sku">SKU *</label><input id="sku" th:field="*{sku}" required><p class="muted" th:errors="*{sku}"></p></div>
        <div><label for="size">Size</label><input id="size" th:field="*{size}" placeholder="XS, S, M, L, XL"></div>
        <div><label for="colour">Colour</label><input id="colour" th:field="*{colour}"></div>
        <div><label for="unitPrice">Unit price (CAD) *</label><input id="unitPrice" type="number" min="0" step="0.01" th:field="*{unitPrice}" required><p class="muted" th:errors="*{unitPrice}"></p></div>
        <div><label for="brand">Brand *</label><select id="brand" th:field="*{brand}" required><option value="">Choose a brand</option><option th:each="b : ${brands}" th:value="${b.brandId}" th:text="${b.brandName}"></option></select></div>
        <div><label for="category">Category *</label><select id="category" th:field="*{category}" required><option value="">Choose a category</option><option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"></option></select></div>
        <div><label for="supplier">Supplier *</label><select id="supplier" th:field="*{supplier}" required><option value="">Choose a supplier</option><option th:each="s : ${suppliers}" th:value="${s.supplierId}" th:text="${s.supplierName}"></option></select></div>
      </div>
      <div class="toolbar"><a class="btn secondary" th:href="@{/products}">Cancel</a><button class="btn" type="submit">Save product</button></div>
    </form>
  </section>
</main><footer>StyleStock · Product management</footer>
</body></html>
